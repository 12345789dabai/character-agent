<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永久角色对话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  height: 100vh; display: flex;
  background: #faf6f0;
  color: #2c3e50;
}

/* ===== 配色变量 ===== */
:root {
  --bg: #faf6f0;
  --surface: #ffffff;
  --accent: #d4a574;
  --accent-light: #f0e4d6;
  --text: #2c3e50;
  --text-dim: #8a8a8a;
  --border: #e8e0d8;
  --shadow: rgba(0,0,0,0.06);
  --bubble-char: #ffffff;
  --bubble-user: #d4a574;
  --bubble-user-text: #ffffff;
}

/* ===== 主聊天区 ===== */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

header {
  padding: 14px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
#memory-badge {
  font-size: 12px; color: var(--text-dim);
  background: var(--bg); padding: 2px 10px; border-radius: 10px;
}
.header-btn {
  border: 1px solid var(--border); background: var(--surface);
  padding: 6px 12px; border-radius: 8px;
  cursor: pointer; font-size: 13px; color: var(--text);
  transition: all .15s;
}
.header-btn:hover { background: var(--accent-light); border-color: var(--accent); }
.char-select {
  font-size: 17px; font-weight: 600; border: none; background: none;
  cursor: pointer; outline: none; font-family: inherit; max-width: 200px;
  color: var(--text);
}
.char-select:hover { opacity: .7; }

/* 阶段标签 */
#char-stage {
  font-size: 11px; color: var(--accent);
  background: var(--accent-light); padding: 3px 10px;
  border-radius: 100px; font-weight: 500; white-space: nowrap;
}

/* 角色头像 */
.char-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; flex-shrink: 0;
}

#messages {
  flex: 1; overflow-y: auto; padding: 20px 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.msg {
  max-width: 78%; padding: 12px 16px; border-radius: 14px;
  line-height: 1.6; font-size: 15px;
  white-space: pre-wrap; word-break: break-word; animation: fadeIn .2s;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.msg.user {
  align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-text);
  border-bottom-right-radius: 4px;
}
.msg.char {
  align-self: flex-start; background: var(--bubble-char); color: var(--text);
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 8px var(--shadow);
  border-left: 3px solid var(--accent);
}
.msg.system {
  align-self: center; background: none; color: var(--text-dim); font-size: 12px; padding: 4px 8px;
}
.msg .name { font-size: 12px; font-weight: 600; margin-bottom: 3px; color: var(--text-dim); }
.msg.user .name { color: rgba(255,255,255,.75); }
.msg .typing-hint { color: var(--text-dim); font-size: 14px; }

/* 角色消息行（头像+气泡） */
.char-row {
  display: flex; align-items: flex-end; gap: 8px;
  align-self: flex-start; max-width: 85%;
}

#input-area {
  padding: 16px 20px 20px; background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
}
#input-area textarea {
  flex: 1; border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 16px; font-size: 15px;
  resize: none; outline: none; font-family: inherit; line-height: 1.5;
  max-height: 140px; background: var(--bg);
  transition: border-color .15s, box-shadow .15s;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
}
#input-area textarea:focus { border-color: var(--accent); box-shadow: inset 0 2px 4px rgba(0,0,0,0.04), 0 0 0 3px rgba(212,165,116,0.1); }
#input-area button {
  background: var(--accent); color: #fff; border: none;
  border-radius: 10px; padding: 11px 22px;
  font-size: 15px; cursor: pointer; transition: opacity .15s;
}
#input-area button:disabled { opacity: .4; cursor: not-allowed; }
#input-area button:hover:not(:disabled) { opacity: .85; }

/* ===== 侧边栏 ===== */
#sidebar {
  width: 340px; background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
#sidebar.hidden { display: none; }
#sidebar h2 { padding: 16px 20px; font-size: 15px; border-bottom: 1px solid var(--border); }
#memory-list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

.memory-card {
  border-radius: 10px; padding: 12px 14px; font-size: 14px;
  line-height: 1.5; border: 1px solid var(--border);
  box-shadow: 0 1px 4px var(--shadow);
}
.memory-card.level-L0 { background: #fef8e7; border-left: 3px solid #d4a017; }
.memory-card.level-L1 { background: #faf6f0; border-left: 3px solid var(--accent); }
.memory-card.level-L2 { background: #ffffff; border-left: 3px solid #ddd6ce; }
.memory-card.level-L3 { background: #f8f8f8; border-left: 3px solid #e8e0d8; }
.memory-card.log-entry { background: #f5f5f5; border-left: 3px solid #ccc; }

.memory-card .time { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
.memory-card .summary { color: var(--text); }
.memory-card .del { float: right; border: none; background: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 2px; }
.memory-card .del:hover { color: #e33; }
.empty-memories { color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 14px; }

/* ===== 弹窗 ===== */
#add-memory-overlay, #create-char-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 300;
  display: flex; align-items: center; justify-content: center;
}
#add-memory-overlay.hidden, #create-char-overlay.hidden { display: none; }

/* ===== 启动/遮罩层 ===== */
#loading-screen {
  position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100; gap: 16px;
}
#loading-screen .spinner {
  width: 30px; height: 30px; border: 3px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen .err { color: #e33; font-size: 14px; }

/* ===== 密码登录页 ===== */
#login-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 500;
  display: flex; align-items: center; justify-content: center;
}
#login-box { width: 340px; max-width: 88vw; text-align: center; }
#login-overlay.hidden { display: none; }
#login-box input:focus { border-color: var(--accent) !important; }
#login-box button { background: var(--accent) !important; }

/* ===== 手机适配 ===== */
@media (max-width: 768px) {
  body { flex-direction: column; }
  #sidebar {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
    border-left: none; transform: translateX(100%); transition: transform .25s ease;
  }
  #sidebar.hidden { display: block; transform: translateX(100%); }
  #sidebar:not(.hidden) { transform: translateX(0); }
  .msg { max-width: 90%; font-size: 15px; }
  .char-row { max-width: 92%; }
  .header-btn { padding: 8px 12px; font-size: 14px; }
  #input-area { padding: 10px 12px 16px; }
  #input-area textarea { font-size: 16px; padding: 10px 12px; }
  #input-area button { padding: 10px 18px; font-size: 16px; }
  #messages { padding: 14px 12px; }
  .char-select { max-width: 140px; font-size: 15px; }
}

@media (max-width: 480px) {
  header { padding: 10px 12px; flex-wrap: wrap; gap: 6px; }
  .msg { max-width: 95%; padding: 10px 13px; font-size: 14px; }
  .char-row { max-width: 97%; }
  #memory-badge { font-size: 11px; }
  #login-box { width: 90vw; }
}
</style>
</head>
<body>

<!-- 启动界面 -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-text">正在连接服务器...</div>
  <div id="loading-steps" style="margin-top:12px;font-size:13px;color:#999;line-height:1.8;">
    <div id="step-1">○ 连接服务</div>
    <div id="step-2">○ 加载角色</div>
    <div id="step-3">○ 准备就绪</div>
  </div>
</div>

<!-- 登录页 -->
<div id="login-overlay">
  <div id="login-box">
    <div style="font-size:32px;margin-bottom:10px;">🤖</div>
    <h2 style="font-size:18px;margin-bottom:6px;">登录</h2>
    <p style="font-size:13px;color:#999;margin-bottom:20px;">输入你的 API Key 开始对话</p>

    <div style="text-align:left;margin-bottom:12px;">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:4px;">API 提供商</label>
      <select id="login-provider" onchange="onProviderChange()" style="width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#fff;">
        <option value="openai">OpenAI 兼容</option>
        <option value="ollama">Ollama (本地)</option>
      </select>
    </div>

    <div id="login-key-group" style="text-align:left;margin-bottom:12px;">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:4px;">API Key</label>
      <input id="login-api-key" type="password" placeholder="sk-..." onkeydown="if(event.key==='Enter')submitLogin()" style="width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;">
    </div>

    <div style="text-align:left;margin-bottom:12px;">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:4px;">模型</label>
      <input id="login-model" placeholder="gpt-4o-mini" value="gpt-4o-mini" style="width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;">
    </div>

    <div id="login-base-url-group" style="text-align:left;margin-bottom:12px;display:none;">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:4px;">API 地址</label>
      <input id="login-base-url" placeholder="http://localhost:11434" style="width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;">
    </div>

    <div id="login-error" style="color:#e33;font-size:13px;margin-top:8px;min-height:20px;"></div>
    <button onclick="submitLogin()" id="login-btn" style="width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:16px;cursor:pointer;">验证并登录</button>
  </div>
</div>

<!-- 主聊天区 -->
<div id="main">
  <header>
    <select id="char-select" onchange="onCharSelect(this)" class="char-select"></select>
    <div class="char-avatar" id="char-avatar" style="width:28px;height:28px;font-size:12px;">智</div>
    <span id="char-stage" style="font-size:11px;color:#d4a574;background:#f0e4d6;padding:3px 10px;border-radius:100px;font-weight:500;white-space:nowrap;"></span>
    <button class="header-btn" id="btn-edit-char" onclick="editCharacter()" title="编辑当前角色" style="font-size:13px;padding:4px 8px;">✎</button>
    <button class="header-btn" id="btn-del-char" onclick="deleteCharacter()" title="删除当前角色" style="font-size:13px;padding:4px 8px;">✕</button>
    <span id="memory-badge">0 条记忆</span>
    <button class="header-btn" id="btn-memory" onclick="toggleSidebar()">记忆</button>
    <button class="header-btn" onclick="exportChat()">导出</button>
    <button class="header-btn" onclick="clearChat()">清空</button>
  </header>

  <div id="messages"><div class="msg system">加载中...</div></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onKey(event)"></textarea>
    <button id="send-btn" onclick="send()">发送</button>
  </div>
</div>

<!-- 侧边栏 -->
<div id="sidebar" class="hidden">
  <h2>记忆 <span id="sidebar-count" style="font-weight:normal;color:#999;font-size:13px;"></span></h2>
  <div style="display:flex;border-bottom:1px solid #e0e0e0;">
    <div class="tab" data-tab="L0" onclick="switchMemTab('L0')" style="flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;border-bottom:2px solid #007aff;font-weight:600;color:#007aff;">核心</div>
    <div class="tab" data-tab="L1" onclick="switchMemTab('L1')" style="flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;color:#888;">重要</div>
    <div class="tab" data-tab="L2" onclick="switchMemTab('L2')" style="flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;color:#888;">一般</div>
    <div class="tab" data-tab="L3" onclick="switchMemTab('L3')" style="flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;color:#888;">琐事</div>
    <div class="tab" data-tab="log" onclick="switchMemTab('log')" style="flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;color:#888;">日志</div>
  </div>
  <div style="padding:8px 16px;display:flex;gap:6px;border-bottom:1px solid #e0e0e0;">
    <input id="memory-search" placeholder="搜索..." style="flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;" oninput="filterMemories(this.value)">
    <button onclick="showAddMemory()" style="padding:6px 12px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;">+添加</button>
  </div>
  <div id="memory-list"><div class="empty-memories">选择一个标签查看</div></div>
</div>

<!-- 结局页面 -->
<div id="ending-page" class="hidden" style="position:fixed;inset:0;background:#fff;z-index:600;display:none;align-items:center;justify-content:center;flex-direction:column;padding:40px;">
  <div style="max-width:500px;text-align:center;">
    <div style="font-size:48px;margin-bottom:16px;">🌅</div>
    <h2 style="font-size:22px;margin-bottom:12px;">旅程的终点</h2>
    <p id="ending-text" style="font-size:16px;color:#555;line-height:1.8;margin-bottom:24px;"></p>
    <button onclick="location.reload()" style="padding:12px 28px;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:16px;cursor:pointer;">开始新的故事</button>
  </div>
</div>

<!-- 添加记忆弹窗 -->
<div id="add-memory-overlay" class="hidden">
  <div style="background:#fff;border-radius:14px;width:400px;max-width:90vw;padding:24px 28px;box-shadow:0 8px 40px rgba(0,0,0,.15);">
    <h3 style="font-size:16px;margin-bottom:16px;">+ 添加记忆</h3>
    <textarea id="add-summary" rows="3" placeholder="记忆内容..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
    <select id="add-level" style="width:100%;margin-top:10px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;">
      <option value="L0">L0 核心信念</option>
      <option value="L1" selected>L1 重要事实</option>
      <option value="L2">L2 一般经历</option>
      <option value="L3">L3 日常琐事</option>
    </select>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button onclick="saveMemory()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#007aff;color:#fff;cursor:pointer;">保存</button>
      <button onclick="closeAddMemory()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#f0f0f0;cursor:pointer;">取消</button>
    </div>
    <div id="add-status" style="margin-top:10px;font-size:13px;text-align:center;color:#34c759;"></div>
  </div>
</div>

<!-- 创建角色弹窗 -->
<div id="create-char-overlay" class="hidden">
  <div style="background:#fff;border-radius:14px;width:440px;max-width:90vw;padding:28px 32px;box-shadow:0 8px 40px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto;">
    <h2 id="cc-title" style="font-size:18px;margin-bottom:16px;">创建新角色</h2>

    <!-- AI 快速生成 -->
    <div style="background:#f0f7ff;border-radius:8px;padding:12px 14px;margin-bottom:16px;">
      <div style="font-size:13px;font-weight:500;color:#1a73e8;margin-bottom:6px;">AI 快速生成</div>
      <div style="display:flex;gap:6px;">
        <input id="cc-ai-prompt" placeholder="输入角色描述，如：林黛玉、诸葛亮、一个温柔的心理医生..." style="flex:1;padding:8px 10px;border:1px solid #cce0ff;border-radius:6px;font-size:13px;outline:none;">
        <button onclick="aiGenerateChar()" id="btn-ai-gen" style="padding:8px 14px;border:none;border-radius:6px;background:#1a73e8;color:#fff;font-size:13px;cursor:pointer;white-space:nowrap;">AI 生成</button>
      </div>
      <div id="cc-ai-status" style="font-size:12px;color:#666;margin-top:4px;"></div>
      <div id="cc-ai-progress" style="display:none;margin-top:6px;font-size:12px;color:#555;">
        <div id="cc-prog-search">○ 搜索资料...</div>
        <div id="cc-prog-analyze">○ 分析理解...</div>
        <div id="cc-prog-generate">○ 生成角色卡...</div>
      </div>
    </div>

    <div style="font-size:12px;color:#ccc;text-align:center;margin-bottom:12px;">—— 或手动填写 ——</div>

    <div class="form-group">
      <label>角色名</label>
      <input id="cc-name" placeholder="如：张三">
    </div>
    <div class="form-group">
      <label>性格</label>
      <input id="cc-personality" placeholder="如：温柔体贴、幽默风趣">
    </div>
    <div class="form-group">
      <label>背景故事</label>
      <textarea id="cc-background" rows="2" placeholder="角色的背景..." style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
    </div>
    <div class="form-group">
      <label>说话风格</label>
      <input id="cc-style" placeholder="如：口语化、喜欢用语气词">
    </div>
    <div class="form-group">
      <label>和用户的关系</label>
      <input id="cc-relationship" placeholder="如：多年好友、知心朋友">
    </div>
    <div class="form-group">
      <label>开场白（可选）</label>
      <input id="cc-greeting" placeholder="如：你好呀！今天想聊什么？">
    </div>
    <div class="form-group">
      <label>价值观（可选）</label>
      <textarea id="cc-values" rows="2" placeholder="角色的核心价值观和信仰..." style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
    </div>
    <div class="form-group">
      <label>行为准则（可选）</label>
      <textarea id="cc-behavior" rows="2" placeholder="什么情况下会怎么做..." style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
    </div>
    <div class="form-group">
      <label>情感层次（可选）</label>
      <textarea id="cc-emotion" rows="1" placeholder="表面情绪/深层情感/矛盾心理..." style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
    </div>
    <div class="form-group">
      <label>知识领域（可选）</label>
      <input id="cc-knowledge" placeholder="用逗号分隔，如：军事战略、诗词创作、哲学">
    </div>
    <div id="cc-status" style="margin-top:8px;font-size:13px;text-align:center;"></div>
    <div class="actions" style="margin-top:16px;">
      <button id="cc-save-btn" onclick="saveCharacter()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#007aff;color:#fff;cursor:pointer;">创建</button>
      <button onclick="closeCreateChar()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#f0f0f0;cursor:pointer;">取消</button>
    </div>
  </div>
</div>

<script>
// ===== 状态 =====
let isLoading = false;
let configured = false;
let lastCharName = '';
let isEditingChar = false;  // 创建弹窗是否处于编辑模式

setTimeout(() => {
  const t = document.getElementById('loading-text');
  if (t && t.textContent === '正在连接服务器...') {
    t.textContent = '连接中...';
  }
}, 8000);

// ===== 启动 =====
window.onload = async () => {
  // 先检查登录状态
  try {
    const authRes = await fetch('/api/auth/check');
    if (authRes.status === 401) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('login-overlay').classList.remove('hidden');
      document.getElementById('login-api-key').focus();
      return;
    }
  } catch (_) {}

  // 已登录，隐藏登录页
  document.getElementById('login-overlay').classList.add('hidden');

  function setStep(n, text) {
    const s = document.getElementById('step-' + n);
    if (s) { s.innerHTML = '● ' + (text || s.textContent.slice(2)); s.style.color = '#333'; }
    for (let i = 1; i < n; i++) {
      const prev = document.getElementById('step-' + i);
      if (prev) { prev.innerHTML = '✓ ' + (prev.dataset.text || prev.textContent.slice(2)); prev.style.color = '#34c759'; }
    }
  }
  try {
    setStep(1, '连接服务...');
    const res = await fetch('/api/status');

    setStep(2, '加载角色...');
    const data = await res.json();
    await loadCharDropdown(data.character);

    if (data.configured) {
      configured = true;
      updateBadge(data.memory_count);
      let greeting = data.greeting;
      if (data.last_message_time) {
        const diff = Date.now() - new Date(data.last_message_time).getTime();
        const hours = diff / 3600000;
        if (hours >= 0.5 && hours < 4) greeting = '回来啦！' + greeting;
        else if (hours >= 4 && hours < 24) greeting = '欢迎回来！' + greeting;
        else if (hours >= 24) greeting = '好久不见！' + greeting;
      }
      setStep(3, '准备就绪');
      showMessage('system', '💬 ' + greeting);
      loadHistory();
      if (data.stage) document.getElementById('char-stage').textContent = data.stage;
      await new Promise(r => setTimeout(r, 300));
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('input').focus();
    } else {
      document.getElementById('loading-screen').innerHTML +=
        '<div class="err">服务未配置 API Key，请联系管理员</div>';
    }
  } catch (e) {
    document.querySelector('#loading-screen .spinner').style.display = 'none';
    document.querySelector('#loading-screen').innerHTML +=
      '<div class="err">无法连接服务器<br><small>' + e.message + '</small></div>';
  }
};

// ===== 角色切换 =====
async function loadCharDropdown(currentName) {
  try {
    const res = await fetch('/api/characters');
    const chars = await res.json();
    const sel = document.getElementById('char-select');
    sel.innerHTML = '';
    chars.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name; opt.textContent = c.name;
      sel.appendChild(opt);
    });
    // 分割线 + 创建新角色
    const sep = document.createElement('option');
    sep.disabled = true; sep.textContent = '────────';
    sel.appendChild(sep);
    const add = document.createElement('option');
    add.value = '__new__'; add.textContent = '＋ 创建新角色';
    sel.appendChild(add);
    if (currentName) {
      sel.value = currentName;
      lastCharName = currentName;
    }
  } catch (_) {}
}

function clearCharForm() {
  ['cc-name','cc-personality','cc-background','cc-style','cc-relationship','cc-greeting',
   'cc-values','cc-behavior','cc-emotion','cc-knowledge','cc-ai-prompt'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('cc-ai-progress').style.display = 'none';
  document.getElementById('cc-ai-status').textContent = '';
  document.getElementById('cc-status').textContent = '';
  document.getElementById('cc-title').textContent = '创建新角色';
  document.getElementById('cc-save-btn').textContent = '创建';
  isEditingChar = false;
}

function onCharSelect(sel) {
  if (sel.value === '__new__') {
    sel.value = lastCharName || '';
    clearCharForm();
    document.getElementById('create-char-overlay').classList.remove('hidden');
    return;
  }
  lastCharName = sel.value;
  switchCharacter(sel.value);
}

async function switchCharacter(name) {
  try {
    const res = await fetch('/api/character/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '切换失败');
    lastCharName = data.character;
    document.getElementById('messages').innerHTML = '';
    showMessage('system', '💬 ' + data.greeting);

}

function updateCharAvatar(name) {

}

function closeCreateChar() {

async function deleteCharacter() {
  const name = document.getElementById('char-select').value;
  if (!name || name === '__new__') return;
  if (!confirm('确认删除角色「' + name + '」？所有关联的记忆和历史也会丢失。')) return;
  try {
    const res = await fetch('/api/character/' + encodeURIComponent(name), { method: 'DELETE' });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '删除失败');
    }
    // 跳转到第一个可用角色
    const r = await fetch('/api/characters');
    const chars = await r.json();
    const next = chars.find(c => c.name !== name);
    await loadCharDropdown(next ? next.name : null);
    if (next) {
      await switchCharacter(next.name);
    } else {
      document.getElementById('messages').innerHTML = '';
      showMessage('system', '没有可用的角色，请创建新角色');
    }
  } catch (e) {
    showMessage('system', '⚠️ ' + e.message);
  }
}

async function saveCharacter() {
  const name = document.getElementById('cc-name').value.trim();
  if (!name) { document.getElementById('cc-status').textContent = '请输入角色名'; return; }
  const btn = document.getElementById('cc-save-btn');
  btn.disabled = true;
  btn.textContent = isEditingChar ? '保存中...' : '创建中...';
  document.getElementById('cc-status').textContent = '';

  const knowledgeRaw = document.getElementById('cc-knowledge').value.trim();
  const body = {
    name: isEditingChar ? lastCharName : name,
    new_name: name,
    personality: document.getElementById('cc-personality').value.trim(),
    background: document.getElementById('cc-background').value.trim(),
    speaking_style: document.getElementById('cc-style').value.trim(),
    relationship: document.getElementById('cc-relationship').value.trim(),
    greeting: document.getElementById('cc-greeting').value.trim(),
    values: document.getElementById('cc-values').value.trim(),
    behavior_rules: document.getElementById('cc-behavior').value.trim(),
    emotional_layers: document.getElementById('cc-emotion').value.trim(),
    knowledge_areas: knowledgeRaw ? knowledgeRaw.split(/[,、]/).map(s => s.trim()).filter(Boolean) : [],
  };

  try {
    const res = await fetch(isEditingChar ? '/api/character/update' : '/api/character/create', {
      method: isEditingChar ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),

// ===== 发送消息（流式） =====
async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || isLoading) return;
  if (!configured) { location.reload(); return; }

  input.value = '';
  input.style.height = 'auto';
  showMessage('user', msg);

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  scrollBottom();

  // 创建角色消息行（头像+气泡）
  const charRow = document.createElement('div');
  charRow.className = 'char-row';
  const avatar = document.createElement('div');
  avatar.className = 'char-avatar';
  avatar.textContent = getCharName().charAt(0);
  const charMsg = document.createElement('div');
  charMsg.className = 'msg char';
  const hintSpan = document.createElement('span');
  hintSpan.className = 'typing-hint';
  hintSpan.textContent = '正在输入...';
  charMsg.innerHTML = '<div class="name">' + esc(getCharName()) + '</div>';
  charMsg.appendChild(hintSpan);
  charRow.appendChild(avatar);
  charRow.appendChild(charMsg);
  document.getElementById('messages').appendChild(charRow);

  let started = false;

  // ===== 发送请求（网络错误自动重试一次） =====
  let res;
  let lastError;
  for (let attempt = 0; attempt <= 1; attempt++) {
    try {
      res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      lastError = null;
      break; // 请求成功，退出重试循环
    } catch (e) {
      lastError = e;
      if (attempt === 0 && e instanceof TypeError) {
        hintSpan.textContent = '重连中...';
        await new Promise(r => setTimeout(r, 1000));
        continue; // 仅首次网络失败时重试
      }
      break;
    }
  }

  // 请求最终还是失败了
  if (lastError) {
    if (charRow.parentNode) charRow.remove();
    showMessage('system', '⚠️ ' + lastError.message);
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('input').focus();
    scrollBottom();
    return;
  }

  // 服务器返回错误
  if (!res.ok) {
    try {
      const err = await res.json();
      throw new Error(err.detail || res.statusText);
    } catch (e) {
      if (charRow.parentNode) charRow.remove();
      showMessage('system', '⚠️ ' + e.message);
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('input').focus();
      scrollBottom();
      return;
    }
  }

  // ===== 流式读取 =====
  let fullBuffer = '';
  try {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      fullBuffer += decoder.decode(value, { stream: true });

      const lines = fullBuffer.split('\n');
      fullBuffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch (_) { continue; }

        if (data.text) {
          if (!started) {
            started = true;
            hintSpan.remove();
          }
          const textEl = charMsg.querySelector('.text') || (() => {
            const t = document.createElement('span');
            t.className = 'text';
            charMsg.appendChild(t);
            return t;
          })();
          textEl.textContent += data.text;
          scrollBottom();
        }

        if (data.error) {
          charMsg.remove();
          showMessage('system', '⚠️ ' + data.error);
        }

        if (data.done) {
          updateBadge(data.memory_count);
          if (data.stage) document.getElementById('char-stage').textContent = data.stage;
          // 检查结局
          fetch('/api/ending').then(r => r.json()).then(ed => {
            if (ed.ending) {
              document.getElementById('main').style.display = 'none';
              document.getElementById('ending-page').classList.remove('hidden');
              document.getElementById('ending-text').textContent = ed.description || '旅程结束了';
            }
          }).catch(() => {});
        }
      }
    }

    // 刷新 buffer 残留
    if (fullBuffer.trim()) {
      const line = fullBuffer.trim();
      if (line.startsWith('data: ')) {
        try {
          const data = JSON.parse(line.slice(6));
          if (data.text) {
            if (!started) {
              started = true;
              hintSpan.remove();
            }
            const textEl = charMsg.querySelector('.text') || (() => {
              const t = document.createElement('span');
              t.className = 'text';
              charMsg.appendChild(t);
              return t;
            })();
            textEl.textContent += data.text;
            scrollBottom();
          }
          if (data.done) updateBadge(data.memory_count);
        } catch (_) {}
      }
    }
  } catch (e) {
    if (charRow.parentNode) charRow.remove();
    showMessage('system', '⚠️ 连接中断: ' + e.message);
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('input').focus();
    scrollBottom();
  }
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

// ===== UI 辅助 =====
function showMessage(type, content, name) {
  const el = document.createElement('div');
  el.className = 'msg ' + type;
  if (name) el.innerHTML = '<div class="name">' + esc(name) + '</div>' + esc(content);
  else el.textContent = content;
  document.getElementById('messages').appendChild(el);
  scrollBottom();
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const msgs = await res.json();
    if (msgs.length === 0) {
      showMessage('system', '💡 开始聊天吧，重要信息会自动保存为长期记忆');
      return;
    }
    for (const msg of msgs) {
      if (msg.role === 'user') showMessage('user', msg.content);
      else if (msg.role === 'assistant') showMessage('char', msg.content, getCharName());
    }
  } catch (_) {}
}

function updateBadge(count) {
  document.getElementById('memory-badge').textContent = count + ' 条记忆';
  document.getElementById('sidebar-count').textContent = '（' + count + ' 条）';
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

// ===== 侧边栏 =====
let _currentMemTab = 'L0';

function toggleSidebar() {
  const panel = document.getElementById('sidebar');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    loadMemories();
  }
}

function switchMemTab(tab) {
  _currentMemTab = tab;
  document.querySelectorAll('.tab').forEach(el => {
    el.style.borderBottomColor = el.dataset.tab === tab ? '#007aff' : 'transparent';
    el.style.color = el.dataset.tab === tab ? '#007aff' : '#888';
    el.style.fontWeight = el.dataset.tab === tab ? '600' : '400';
  });
  loadMemories();
}

async function loadMemories() {
  const list = document.getElementById('memory-list');
  list.innerHTML = '<div class="empty-memories">加载中...</div>';
  try {
    const res = await fetch('/api/memories');
    const data = await res.json();
    const bucketMap = { L0: 'L0', L1: 'L1', L2: 'L2', L3: 'L3', log: '日志' };
    const bucket = bucketMap[_currentMemTab] || 'L0';
    const items = data[bucket] || [];

    if (!items.length) {
      list.innerHTML = '<div class="empty-memories">这里还没有内容</div>';
      return;
    }

    list.innerHTML = '';
    items.slice().reverse().forEach(item => {
      const card = document.createElement('div');
      card.className = 'memory-card level-' + (item.level || 'L2');

      if (bucket !== '日志') {
        const editBtn = document.createElement('button');
        editBtn.className = 'del';
        editBtn.textContent = '✎';
        editBtn.style.marginRight = '4px';
        editBtn.onclick = () => startEditMemory(item.id, contentEl, editBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'del';
        delBtn.textContent = '×';
        delBtn.onclick = () => deleteMemory(item.id, card);

        const time = document.createElement('div');
        time.className = 'time';
        let timeText = item.created ? item.created.slice(0, 10) : '';
        if (item.expires) timeText += ' ～' + item.expires.slice(0, 10);
        time.textContent = timeText;

        const badge = document.createElement('div');
        badge.style.cssText = 'font-size:11px;color:#666;margin-top:4px;';
        const src = item.source === 'self' ? '自己说的' : item.source === 'user' ? '对方说的' : '';
        const w = item.weight || 1.0;
        const em = item.emotion_intensity || 0;
        const emoji = em > 0.7 ? '🔥' : em > 0.4 ? '📌' : '💭';
        badge.textContent = `${emoji} 权重:${w.toFixed(1)} 情绪:${em.toFixed(1)}`;
        if (src) badge.textContent += ` | ${src}`;

        const contentEl = document.createElement('div');
        contentEl.className = 'summary';
        contentEl.textContent = item.content;

        card.appendChild(editBtn);
        card.appendChild(delBtn);
        card.appendChild(time);
        if (badge.textContent) card.appendChild(badge);
        card.appendChild(contentEl);
      } else {
        card.className = 'memory-card log-entry';
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = item.time ? item.time.slice(0, 16) : '';
        const contentEl = document.createElement('div');
        contentEl.className = 'summary';
        contentEl.textContent = item.content;

        card.appendChild(time);
        card.appendChild(contentEl);
      }

      list.appendChild(card);
    });
  } catch (e) {
    list.innerHTML = '<div class="empty-memories">加载失败：' + e.message + '</div>';
  }
}

async function deleteMemory(id, cardEl) {
  if (!confirm('删除这条记录？')) return;
  try {
    await fetch('/api/memories/' + encodeURIComponent(id), { method: 'DELETE' });
    cardEl.remove();
  } catch (_) { alert('删除失败'); }
}

function startEditMemory(id, summaryEl, btn) {
  btn.dataset.mid = id;
  const orig = summaryEl.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = orig;
  input.className = 'summary';
  input.style.cssText = 'width:100%;padding:4px 6px;border:1px solid #007aff;border-radius:4px;font-size:14px;outline:none;font-family:inherit;';
  summaryEl.replaceWith(input);
  btn.textContent = '✓';
  btn.style.color = '#34c759';
  btn.onclick = () => saveEditMemory(id, input, btn, orig);
  input.focus();
  input.select();
  input.onkeydown = (e) => {
    if (e.key === 'Enter') saveEditMemory(id, input, btn, orig);
    if (e.key === 'Escape') cancelEdit(input, btn, orig);
  };
}

async function saveEditMemory(id, input, btn, orig) {
  const val = input.value.trim();
  if (!val || val === orig) return cancelEdit(input, btn, orig);
  try {
    const res = await fetch('/api/memories/' + encodeURIComponent(id), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ summary: val }),
    });
    if (!res.ok) throw new Error();
    const summaryEl = document.createElement('div');
    summaryEl.className = 'summary';
    summaryEl.textContent = val;
    input.replaceWith(summaryEl);
    btn.textContent = '✎';
    btn.style.color = '';
    btn.onclick = () => startEditMemory(id, summaryEl, btn);
  } catch (_) {
    cancelEdit(input, btn, orig);
  }
}

function cancelEdit(input, btn, orig) {
  const summaryEl = document.createElement('div');
  summaryEl.className = 'summary';
  summaryEl.textContent = orig;
  input.replaceWith(summaryEl);
  btn.textContent = '✎';
  btn.style.color = '';
  const mid = btn.dataset.mid;
  btn.onclick = () => { if (mid) startEditMemory(mid, summaryEl, btn); };
}

async function clearChat() {
  if (!confirm('清空当前对话？记忆不会被删除。')) return;
  try {
    await fetch('/api/history', { method: 'DELETE' });
    document.getElementById('messages').innerHTML = '';
    showMessage('system', '对话已清空');
  } catch (e) {
    showMessage('system', '⚠️ 清空失败');
  }
}

async function exportChat() {
  try {
    const res = await fetch('/api/export');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chat_history.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    showMessage('system', '⚠️ 导出失败');
  }
}

// ===== 登录 =====
function onProviderChange() {
  const provider = document.getElementById('login-provider').value;
  const keyGroup = document.getElementById('login-key-group');
  const urlGroup = document.getElementById('login-base-url-group');
  const modelInput = document.getElementById('login-model');

  if (provider === 'ollama') {
    keyGroup.style.display = 'none';
    urlGroup.style.display = 'block';
    modelInput.value = 'qwen2.5';
    document.getElementById('login-base-url').value = 'http://localhost:11434';
  } else {
    keyGroup.style.display = 'block';
    urlGroup.style.display = 'none';
    modelInput.value = 'gpt-4o-mini';
  }
}

async function submitLogin() {
  const provider = document.getElementById('login-provider').value;
  const apiKey = document.getElementById('login-api-key').value.trim();
  const model = document.getElementById('login-model').value.trim();
  const baseUrl = document.getElementById('login-base-url').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  if (provider === 'openai' && !apiKey) {
    errEl.textContent = '请输入 API Key';
    return;
  }

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '验证中...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        api_key: apiKey,
        provider: provider,
        model: model || 'gpt-4o-mini',
        base_url: baseUrl,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      setTimeout(() => location.reload(), 200);
    } else {
      errEl.textContent = data.detail || '登录失败';
    }
  } catch (e) {
    errEl.textContent = '请求失败：' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '验证并登录';
  }
}

// ===== 记忆手动管理 =====
function showAddMemory() {
  document.getElementById('add-memory-overlay').classList.remove('hidden');
  document.getElementById('add-summary').value = '';
  document.getElementById('add-facts').value = '';
  document.getElementById('add-status').textContent = '';
}
function closeAddMemory() {
  document.getElementById('add-memory-overlay').classList.add('hidden');
}
async function saveMemory() {
  const summary = document.getElementById('add-summary').value.trim();
  if (!summary) return;
  const level = document.getElementById('add-level').value;
  const btn = document.querySelector('#add-memory-overlay button');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const res = await fetch('/api/memories', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ summary }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    document.getElementById('add-status').textContent = '✅ 已保存';
    document.getElementById('add-status').style.color = '#34c759';
    updateBadge(data.memory_count);
    setTimeout(closeAddMemory, 800);
  } catch (e) {
    document.getElementById('add-status').textContent = '❌ ' + e.message;
    document.getElementById('add-status').style.color = '#e33';
  } finally {
    btn.disabled = false; btn.textContent = '保存';
  }
}

function filterMemories(keyword) {
  const list = document.getElementById('memory-list');
  const cards = list.querySelectorAll('.memory-card');
  const kw = keyword.toLowerCase().trim();
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = !kw || text.includes(kw) ? '' : 'none';
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 输入框自动高度
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});
</script>
