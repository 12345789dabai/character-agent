<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永久角色对话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, system-ui, sans-serif; height: 100vh; display: flex; background: #f5f5f5; }

/* ===== 主聊天区 ===== */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

header {
  padding: 14px 20px; background: #fff; border-bottom: 1px solid #e0e0e0;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
#memory-badge { font-size: 12px; color: #888; background: #f0f0f0; padding: 2px 10px; border-radius: 10px; }
.header-btn {
  border: 1px solid #ddd; background: #fff; padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: #555; transition: background .15s;
}
.header-btn:hover { background: #f0f0f0; }
#btn-memory { margin-left: auto; }
#btn-settings { font-size: 18px; padding: 4px 10px; line-height: 1; }
.char-select {
  font-size: 17px; font-weight: 600; border: none; background: none;
  cursor: pointer; outline: none; font-family: inherit; max-width: 200px;
}
.char-select:hover { opacity: .7; }

#messages {
  flex: 1; overflow-y: auto; padding: 20px 20px; display: flex; flex-direction: column; gap: 14px;
}
.msg {
  max-width: 78%; padding: 11px 15px; border-radius: 12px; line-height: 1.6;
  font-size: 15px; white-space: pre-wrap; word-break: break-word; animation: fadeIn .2s;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
.msg.char { align-self: flex-start; background: #fff; color: #222; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.msg.system { align-self: center; background: none; color: #999; font-size: 12px; padding: 4px 8px; }
.msg .name { font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #666; }
.msg.user .name { color: rgba(255,255,255,.75); }


#input-area {
  padding: 14px 20px; background: #fff; border-top: 1px solid #e0e0e0;
  display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
}
#input-area textarea {
  flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 11px 14px; font-size: 15px;
  resize: none; outline: none; font-family: inherit; line-height: 1.5; max-height: 140px;
}
#input-area textarea:focus { border-color: #007aff; }
#input-area button {
  background: #007aff; color: #fff; border: none; border-radius: 10px; padding: 11px 22px;
  font-size: 15px; cursor: pointer; transition: opacity .15s;
}
#input-area button:disabled { opacity: .4; cursor: not-allowed; }
#input-area button:hover:not(:disabled) { opacity: .85; }

/* ===== 侧边栏 ===== */
#sidebar {
  width: 340px; background: #fff; border-left: 1px solid #e0e0e0;
  display: flex; flex-direction: column; flex-shrink: 0;
}
#sidebar.hidden { display: none; }
#sidebar h2 { padding: 16px 20px; font-size: 15px; border-bottom: 1px solid #e0e0e0; }
#memory-list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.memory-card {
  background: #f8f9fa; border-radius: 8px; padding: 11px 13px; font-size: 14px; line-height: 1.5; border: 1px solid #eee;
}
.memory-card .time { font-size: 11px; color: #999; margin-bottom: 3px; }
.memory-card .summary { color: #333; }
.memory-card .facts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.memory-card .facts span { background: #e8f0fe; color: #1a73e8; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.memory-card .del { float: right; border: none; background: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 2px; }
.memory-card .del:hover { color: #e33; }
.empty-memories { color: #999; text-align: center; padding: 40px 20px; font-size: 14px; }

/* ===== 启动/遮罩层 ===== */
#loading-screen {
  position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100; gap: 16px;
}
#loading-screen .spinner {
  width: 30px; height: 30px; border: 3px solid #e0e0e0; border-top: 3px solid #007aff;
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen .err { color: #e33; font-size: 14px; }

/* ===== 设置弹窗 ===== */
#settings-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
#settings-overlay.hidden { display: none; }
#add-memory-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 300; display: flex; align-items: center; justify-content: center; }
#add-memory-overlay.hidden { display: none; }
#create-char-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 250; display: flex; align-items: center; justify-content: center; }
#create-char-overlay.hidden { display: none; }
#settings-box {
  background: #fff; border-radius: 14px; width: 420px; max-width: 90vw;
  padding: 28px 32px; box-shadow: 0 8px 40px rgba(0,0,0,.15);
}
#settings-box h2 { font-size: 18px; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 5px; }
.form-group input, .form-group select {
  width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 14px; outline: none; font-family: inherit;
}
.form-group input:focus, .form-group select:focus { border-color: #007aff; }
.form-hint { font-size: 12px; color: #999; margin-top: 3px; }
#settings-box .actions { display: flex; gap: 10px; margin-top: 22px; }
#settings-box .actions button {
  flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; transition: opacity .15s;
}
.btn-primary { background: #007aff; color: #fff; }
.btn-primary:hover { opacity: .85; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e5e5e5; }
#settings-status { margin-top: 12px; font-size: 13px; text-align: center; }
#settings-status.ok { color: #34c759; }
#settings-status.err { color: #e33; }
</style>
</head>
<body>

<!-- 启动界面 -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-text">正在连接服务器...</div>
  <div id="loading-steps" style="margin-top:12px;font-size:13px;color:#999;line-height:1.8;">
    <div id="step-1">○ 连接服务</div>
    <div id="step-2">○ 加载角色</div>
    <div id="step-3">○ 准备就绪</div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settings-overlay">
  <div id="settings-box">
    <h2>⚙️ API 设置</h2>
    <div class="form-group">
      <label>服务商</label>
      <select id="s-provider" onchange="onProviderChange()">
        <option value="openai">OpenAI 兼容</option>
        <option value="ollama">Ollama（本地）</option>
      </select>
    </div>
    <div class="form-group" id="s-key-group">
      <label>API Key</label>
      <div style="display:flex;gap:6px;">
        <input id="s-key" type="password" placeholder="sk-..." autocomplete="off" style="flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;">
        <button onclick="pasteKey()" title="从剪贴板粘贴检测" style="padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;white-space:nowrap;">📋 粘贴</button>
      </div>
    </div>
    <div class="form-group">
      <label>模型</label>
      <input id="s-model" placeholder="gpt-4o-mini">
      <div class="form-hint" id="s-model-hint"></div>
    </div>
    <div class="form-group">
      <label>接口地址</label>
      <input id="s-url" placeholder="https://api.openai.com/v1">
      <div class="form-hint" id="s-url-hint"></div>
    </div>
    <div id="s-status-msg" style="margin-top:8px;font-size:13px;text-align:center;"></div>
    <div id="settings-status"></div>
    <button class="btn-secondary" id="btn-test" onclick="testConnection()" style="width:100%;margin-top:8px;">测试连接</button>
    <div class="actions" style="margin-top:10px;">
      <button class="btn-primary" id="btn-save" onclick="saveSettings()">保存并连接</button>
      <button class="btn-secondary" id="btn-close-settings" onclick="closeSettings()">取消</button>
    </div>
  </div>
</div>

<!-- 主聊天区 -->
<div id="main">
  <header>
    <select id="char-select" onchange="onCharSelect(this)" class="char-select"></select>
    <span id="memory-badge">0 条记忆</span>
    <button class="header-btn" id="btn-memory" onclick="toggleSidebar()">记忆</button>
    <button class="header-btn" onclick="exportChat()">导出</button>
    <button class="header-btn" onclick="clearChat()">清空</button>
    <button class="header-btn" id="btn-settings" onclick="openSettings()">⚙</button>
  </header>

  <div id="messages"><div class="msg system">加载中...</div></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onKey(event)"></textarea>
    <button id="send-btn" onclick="send()">发送</button>
  </div>
</div>

<!-- 侧边栏 -->
<div id="sidebar" class="hidden">
  <h2>长期记忆 <span id="sidebar-count" style="font-weight:normal;color:#999;font-size:13px;"></span></h2>
  <div style="padding:8px 16px;display:flex;gap:6px;border-bottom:1px solid #e0e0e0;">
    <input id="memory-search" placeholder="搜索记忆..." style="flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;" oninput="filterMemories(this.value)">
    <button onclick="showAddMemory()" style="padding:6px 12px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;">+添加</button>
  </div>
  <div id="memory-list"><div class="empty-memories">点击「记忆」按钮查看</div></div>
</div>

<!-- 添加记忆弹窗 -->
<div id="add-memory-overlay" class="hidden">
  <div style="background:#fff;border-radius:14px;width:400px;max-width:90vw;padding:24px 28px;box-shadow:0 8px 40px rgba(0,0,0,.15);">
    <h3 style="font-size:16px;margin-bottom:16px;">+ 添加记忆</h3>
    <textarea id="add-summary" rows="3" placeholder="记忆内容..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
    <input id="add-facts" placeholder="关键事实（逗号分隔，可选）" style="width:100%;margin-top:10px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;">
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button onclick="saveMemory()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#007aff;color:#fff;cursor:pointer;">保存</button>
      <button onclick="closeAddMemory()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#f0f0f0;cursor:pointer;">取消</button>
    </div>
    <div id="add-status" style="margin-top:10px;font-size:13px;text-align:center;color:#34c759;"></div>
  </div>
</div>

<!-- 创建角色弹窗 -->
<div id="create-char-overlay" class="hidden">
  <div style="background:#fff;border-radius:14px;width:440px;max-width:90vw;padding:28px 32px;box-shadow:0 8px 40px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto;">
    <h2 style="font-size:18px;margin-bottom:16px;">创建新角色</h2>

    <!-- AI 快速生成 -->
    <div style="background:#f0f7ff;border-radius:8px;padding:12px 14px;margin-bottom:16px;">
      <div style="font-size:13px;font-weight:500;color:#1a73e8;margin-bottom:6px;">AI 快速生成</div>
      <div style="display:flex;gap:6px;">
        <input id="cc-ai-prompt" placeholder="输入角色描述，如：林黛玉、诸葛亮、一个温柔的心理医生..." style="flex:1;padding:8px 10px;border:1px solid #cce0ff;border-radius:6px;font-size:13px;outline:none;">
        <button onclick="aiGenerateChar()" id="btn-ai-gen" style="padding:8px 14px;border:none;border-radius:6px;background:#1a73e8;color:#fff;font-size:13px;cursor:pointer;white-space:nowrap;">AI 生成</button>
      </div>
      <div id="cc-ai-status" style="font-size:12px;color:#666;margin-top:4px;"></div>
    </div>

    <div style="font-size:12px;color:#ccc;text-align:center;margin-bottom:12px;">—— 或手动填写 ——</div>

    <div class="form-group">
      <label>角色名</label>
      <input id="cc-name" placeholder="如：张三">
    </div>
    <div class="form-group">
      <label>性格</label>
      <input id="cc-personality" placeholder="如：温柔体贴、幽默风趣">
    </div>
    <div class="form-group">
      <label>背景故事</label>
      <textarea id="cc-background" rows="2" placeholder="角色的背景..." style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:none;outline:none;font-family:inherit;"></textarea>
    </div>
    <div class="form-group">
      <label>说话风格</label>
      <input id="cc-style" placeholder="如：口语化、喜欢用语气词">
    </div>
    <div class="form-group">
      <label>和用户的关系</label>
      <input id="cc-relationship" placeholder="如：多年好友、知心朋友">
    </div>
    <div class="form-group">
      <label>开场白（可选）</label>
      <input id="cc-greeting" placeholder="如：你好呀！今天想聊什么？">
    </div>
    <div id="cc-status" style="margin-top:8px;font-size:13px;text-align:center;"></div>
    <div class="actions" style="margin-top:16px;">
      <button onclick="saveCharacter()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#007aff;color:#fff;cursor:pointer;">创建</button>
      <button onclick="closeCreateChar()" style="flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;background:#f0f0f0;cursor:pointer;">取消</button>
    </div>
  </div>
</div>

<script>
// ===== 状态 =====
let isLoading = false;
let configured = false;

// ===== 启动 =====
window.onload = async () => {
  function setStep(n, text) {
    const s = document.getElementById('step-' + n);
    if (s) { s.innerHTML = '● ' + (text || s.textContent.slice(2)); s.style.color = '#333'; }
    for (let i = 1; i < n; i++) {
      const prev = document.getElementById('step-' + i);
      if (prev) { prev.innerHTML = '✓ ' + (prev.dataset.text || prev.textContent.slice(2)); prev.style.color = '#34c759'; }
    }
  }
  try {
    setStep(1, '连接服务...');
    const res = await fetch('/api/status');

    setStep(2, '加载角色...');
    const data = await res.json();
    await loadCharDropdown(data.character);

    if (data.configured) {
      configured = true;
      updateBadge(data.memory_count);
      let greeting = data.greeting;
      if (data.last_message_time) {
        const diff = Date.now() - new Date(data.last_message_time).getTime();
        const hours = diff / 3600000;
        if (hours >= 0.5 && hours < 4) greeting = '回来啦！' + greeting;
        else if (hours >= 4 && hours < 24) greeting = '欢迎回来！' + greeting;
        else if (hours >= 24) greeting = '好久不见！' + greeting;
      }
      setStep(3, '准备就绪');
      showMessage('system', '💬 ' + greeting);
      loadHistory();
      await new Promise(r => setTimeout(r, 300));
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('input').focus();
    } else {
      document.getElementById('loading-screen').style.display = 'none';
      loadSettings();
      document.getElementById('settings-overlay').classList.remove('hidden');
      document.getElementById('btn-close-settings').style.display = 'none';
    }
  } catch (e) {
    document.querySelector('#loading-screen .spinner').style.display = 'none';
    document.querySelector('#loading-screen').innerHTML +=
      '<div class="err">无法连接服务器<br><small>' + e.message + '</small></div>';
  }
};

// ===== 角色切换 =====
async function loadCharDropdown(currentName) {
  try {
    const res = await fetch('/api/characters');
    const chars = await res.json();
    const sel = document.getElementById('char-select');
    sel.innerHTML = '';
    chars.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name; opt.textContent = c.name;
      sel.appendChild(opt);
    });
    // 分割线 + 创建新角色
    const sep = document.createElement('option');
    sep.disabled = true; sep.textContent = '────────';
    sel.appendChild(sep);
    const add = document.createElement('option');
    add.value = '__new__'; add.textContent = '＋ 创建新角色';
    sel.appendChild(add);
    if (currentName) sel.value = currentName;
  } catch (_) {}
}

function onCharSelect(sel) {
  if (sel.value === '__new__') {
    sel.value = getCharName();
    document.getElementById('create-char-overlay').classList.remove('hidden');
    return;
  }
  switchCharacter(sel.value);
}

async function switchCharacter(name) {
  try {
    const res = await fetch('/api/character/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '切换失败');
    document.getElementById('messages').innerHTML = '';
    showMessage('system', '💬 ' + data.greeting);
    updateBadge(data.memory_count);
    loadHistory();
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('input').focus();
  } catch (e) {
    showMessage('system', '⚠️ ' + e.message);
  }
}

function getCharName() {
  const s = document.getElementById('char-select');
  return s.options[s.selectedIndex]?.text || '助手';
}

function closeCreateChar() {
  document.getElementById('create-char-overlay').classList.add('hidden');
}

async function aiGenerateChar() {
  const desc = document.getElementById('cc-ai-prompt').value.trim();
  if (!desc) { document.getElementById('cc-ai-status').textContent = '请输入角色描述'; return; }
  const btn = document.getElementById('btn-ai-gen');
  btn.disabled = true; btn.textContent = '生成中...';
  document.getElementById('cc-ai-status').textContent = '';
  try {
    const res = await fetch('/api/character/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '生成失败');
    document.getElementById('cc-name').value = data.name || '';
    document.getElementById('cc-personality').value = data.personality || '';
    document.getElementById('cc-background').value = data.background || '';
    document.getElementById('cc-style').value = data.speaking_style || '';
    document.getElementById('cc-relationship').value = data.relationship_to_user || '';
    document.getElementById('cc-greeting').value = data.greeting || '';
    document.getElementById('cc-ai-status').textContent = '✅ 已生成，可手动修改';
    document.getElementById('cc-ai-status').style.color = '#34c759';
  } catch (e) {
    document.getElementById('cc-ai-status').textContent = '❌ ' + e.message;
    document.getElementById('cc-ai-status').style.color = '#e33';
  } finally {
    btn.disabled = false; btn.textContent = 'AI 生成';
  }
}

async function saveCharacter() {
  const name = document.getElementById('cc-name').value.trim();
  if (!name) { document.getElementById('cc-status').textContent = '请输入角色名'; return; }
  const btn = document.querySelector('#create-char-overlay .actions button:nth-child(1)');
  btn.disabled = true; btn.textContent = '创建中...';
  document.getElementById('cc-status').textContent = '';
  try {
    const res = await fetch('/api/character/create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        personality: document.getElementById('cc-personality').value.trim(),
        background: document.getElementById('cc-background').value.trim(),
        speaking_style: document.getElementById('cc-style').value.trim(),
        relationship: document.getElementById('cc-relationship').value.trim(),
        greeting: document.getElementById('cc-greeting').value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '创建失败');
    document.getElementById('cc-status').textContent = '✅ 创建成功！';
    document.getElementById('cc-status').style.color = '#34c759';
    setTimeout(() => {
      closeCreateChar();
      loadCharDropdown(name);
      switchCharacter(name);
    }, 800);
  } catch (e) {
    document.getElementById('cc-status').textContent = '❌ ' + e.message;
    document.getElementById('cc-status').style.color = '#e33';
  } finally {
    btn.disabled = false; btn.textContent = '创建';
  }
}

// ===== 设置 =====
const PRESETS = {
  openai: { model: 'gpt-4o-mini', url: 'https://api.openai.com/v1', hintModel: '如 gpt-4o-mini、gpt-4o', hintUrl: 'OpenAI 官方或兼容服务地址' },
  ollama: { model: 'qwen2.5', url: 'http://localhost:11434', hintModel: '如 qwen2.5、llama3', hintUrl: 'Ollama 服务地址，默认 http://localhost:11434' },
};

async function pasteKey() {
  try {
    const text = await navigator.clipboard.readText();
    const key = text.trim();
    if (key && (key.startsWith('sk-') || key.startsWith('sk_'))) {
      document.getElementById('s-key').value = key;
      document.getElementById('s-status-msg').textContent = '✅ 已检测到 API Key';
      document.getElementById('s-status-msg').className = 'ok';
    } else {
      document.getElementById('s-status-msg').textContent = '❌ 剪贴板内容不是有效的 API Key';
      document.getElementById('s-status-msg').className = 'err';
    }
  } catch (e) {
    document.getElementById('s-status-msg').textContent = '❌ 无法读取剪贴板（请手动粘贴）';
    document.getElementById('s-status-msg').className = 'err';
  }
}

function onProviderChange() {
  const p = document.getElementById('s-provider').value;
  const preset = PRESETS[p];
  document.getElementById('s-model').placeholder = preset.model;
  document.getElementById('s-model-hint').textContent = preset.hintModel;
  document.getElementById('s-url').placeholder = preset.url;
  document.getElementById('s-url-hint').textContent = preset.hintUrl;
  // 选 Ollama 时隐藏 API Key
  document.getElementById('s-key-group').style.display = p === 'ollama' ? 'none' : 'block';
}

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const s = await res.json();
    document.getElementById('s-provider').value = s.provider || 'openai';
    document.getElementById('s-key').value = '';
    document.getElementById('s-model').value = s.model || '';
    document.getElementById('s-url').value = s.base_url || '';
    // 如果已经有 key 回填，显示一个提示
    if (s.api_key && s.api_key !== '') {
      document.getElementById('s-key').placeholder = s.api_key;
    }
    onProviderChange();
  } catch (_) {}
}

async function testConnection() {
  const btn = document.getElementById('btn-test');
  btn.disabled = true; btn.textContent = '测试中...';
  document.getElementById('settings-status').textContent = '';
  document.getElementById('settings-status').className = '';
  const provider = document.getElementById('s-provider').value;
  let apiKey = document.getElementById('s-key').value;
  const model = document.getElementById('s-model').value || PRESETS[provider].model;
  const baseUrl = document.getElementById('s-url').value || PRESETS[provider].url;
  if (apiKey.includes('***')) apiKey = '';
  try {
    const res = await fetch('/api/settings/test', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider, api_key: apiKey, model, base_url: baseUrl }),
    });
    const data = await res.json();
    const el = document.getElementById('settings-status');
    if (res.ok) { el.textContent = '✅ ' + data.message; el.className = 'ok'; }
    else { el.textContent = '❌ ' + (data.detail || '失败'); el.className = 'err'; }
  } catch (e) {
    const el = document.getElementById('settings-status');
    el.textContent = '❌ 请求失败'; el.className = 'err';
  } finally {
    btn.disabled = false; btn.textContent = '测试连接';
  }
}

async function saveSettings() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = '连接中...';
  document.getElementById('settings-status').textContent = '';
  document.getElementById('settings-status').className = '';

  const provider = document.getElementById('s-provider').value;
  let apiKey = document.getElementById('s-key').value;
  const model = document.getElementById('s-model').value || PRESETS[provider].model;
  const baseUrl = document.getElementById('s-url').value || PRESETS[provider].url;

  // 如果 key 是脱敏显示的占位符，清空（让后端用已有的）
  if (apiKey.includes('***')) apiKey = '';

  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider, api_key: apiKey, model, base_url: baseUrl }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '保存失败');

    configured = true;
    document.getElementById('settings-overlay').classList.add('hidden');
    document.getElementById('btn-close-settings').style.display = 'block';

    const statusEl = document.getElementById('settings-status');
    statusEl.textContent = '✅ ' + data.message;
    statusEl.className = 'ok';

    // 首次配置时加载角色下拉框
    const s = await fetch('/api/status').then(r => r.json());
    if (s.character) await loadCharDropdown(s.character);
    showMessage('system', '💬 ' + (s.greeting || '配置完成，开始聊天吧！'));
    updateBadge(s.memory_count);
    document.getElementById('input').focus();
  } catch (e) {
    const statusEl = document.getElementById('settings-status');
    statusEl.textContent = '❌ ' + e.message;
    statusEl.className = 'err';
  } finally {
    btn.disabled = false;
    btn.textContent = '保存并连接';
  }
}

function openSettings() {
  document.getElementById('settings-overlay').classList.remove('hidden');
  document.getElementById('btn-close-settings').style.display = 'block';
  loadSettings();
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.add('hidden');
}

// ===== 发送消息（流式） =====
async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || isLoading) return;
  if (!configured) { openSettings(); return; }

  input.value = '';
  input.style.height = 'auto';
  showMessage('user', msg);

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  scrollBottom();

  // 创建空白角色消息气泡，后面逐字追加
  const charMsg = document.createElement('div');
  charMsg.className = 'msg char';
  const charName = getCharName();
  charMsg.innerHTML = '<div class="name">' + esc(charName) + '</div>';
  document.getElementById('messages').appendChild(charMsg);

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || res.statusText);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 按行解析 SSE
      const lines = buffer.split('\n');
      buffer = lines.pop() || ''; // 不完整的行留在 buffer

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch (_) { continue; }

        if (data.text) {
          // 追加文本到气泡
          const textEl = charMsg.querySelector('.text') || (() => {
            const t = document.createElement('span');
            t.className = 'text';
            charMsg.appendChild(t);
            return t;
          })();
          textEl.textContent += data.text;
          scrollBottom();
        }

        if (data.error) {
          charMsg.remove();
          showMessage('system', '⚠️ ' + data.error);
        }

        if (data.done) {
          updateBadge(data.memory_count);
        }
      }
    }
  } catch (e) {
    if (charMsg.parentNode) charMsg.remove();
    showMessage('system', '⚠️ ' + e.message);
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('input').focus();
    scrollBottom();
  }
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

// ===== UI 辅助 =====
function showMessage(type, content, name) {
  const el = document.createElement('div');
  el.className = 'msg ' + type;
  if (name) el.innerHTML = '<div class="name">' + esc(name) + '</div>' + esc(content);
  else el.textContent = content;
  document.getElementById('messages').appendChild(el);
  scrollBottom();
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const msgs = await res.json();
    for (const msg of msgs) {
      if (msg.role === 'user') showMessage('user', msg.content);
      else if (msg.role === 'assistant') showMessage('char', msg.content, getCharName());
    }
  } catch (_) {}
}

function updateBadge(count) {
  document.getElementById('memory-badge').textContent = count + ' 条记忆';
  document.getElementById('sidebar-count').textContent = '（' + count + ' 条）';
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

// ===== 侧边栏 =====
function toggleSidebar() {
  const panel = document.getElementById('sidebar');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    loadMemories();
  }
}

async function loadMemories() {
  const list = document.getElementById('memory-list');
  list.innerHTML = '<div class="empty-memories">加载中...</div>';
  try {
    const res = await fetch('/api/memories');
    const mems = await res.json();
    if (!mems.length) {
      list.innerHTML = '<div class="empty-memories">还没有长期记忆<br><small>多聊几轮会自动生成</small></div>';
      return;
    }

    // 按日期分组
    const groups = {};
    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const yesterdayStr = new Date(now - 86400000).toISOString().slice(0, 10);

    mems.forEach(m => {
      const date = m.timestamp ? m.timestamp.slice(0, 10) : '';
      const key = date || '未知';
      if (!groups[key]) groups[key] = [];
      groups[key].push(m);
    });

    list.innerHTML = '';
    const dateLabels = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    dateLabels.forEach(date => {
      // 日期标题
      let label;
      if (date === todayStr) label = '📌 今天';
      else if (date === yesterdayStr) label = '📌 昨天';
      else if (date.slice(0, 4) === todayStr.slice(0, 4)) label = date.slice(5);
      else label = date;

      const title = document.createElement('div');
      title.style.cssText = 'font-size:12px;color:#999;margin:12px 0 6px;font-weight:500;';
      title.textContent = label;
      list.appendChild(title);

      groups[date].forEach(m => {
        const card = document.createElement('div');
        card.className = 'memory-card';

        const editBtn = document.createElement('button');
        editBtn.className = 'del';
        editBtn.textContent = '✎';
        editBtn.style.marginRight = '4px';
        editBtn.onclick = () => startEditMemory(m.id, summaryEl, editBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'del';
        delBtn.textContent = '×';
        delBtn.onclick = () => deleteMemory(m.id, card);

        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = m.timestamp ? m.timestamp.slice(11, 16) : '';

        const summaryEl = document.createElement('div');
        summaryEl.className = 'summary';
        summaryEl.textContent = m.summary;

        card.appendChild(editBtn);
        card.appendChild(delBtn);
        card.appendChild(time);
        card.appendChild(summaryEl);

        if (m.facts && m.facts.length) {
          const facts = document.createElement('div');
          facts.className = 'facts';
          m.facts.forEach(f => {
            const span = document.createElement('span');
            span.textContent = f;
            facts.appendChild(span);
          });
          card.appendChild(facts);
        }

        list.appendChild(card);
      });
    });
  } catch (e) {
    list.innerHTML = '<div class="empty-memories">加载失败：' + e.message + '</div>';
  }
}

async function deleteMemory(id, cardEl) {
  if (!confirm('删除这条记忆？')) return;
  try {
    await fetch('/api/memories/' + encodeURIComponent(id), { method: 'DELETE' });
    cardEl.remove();
    updateBadge(document.querySelectorAll('.memory-card').length);
  } catch (_) { alert('删除失败'); }
}

function startEditMemory(id, summaryEl, btn) {
  btn.dataset.mid = id;
  const orig = summaryEl.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = orig;
  input.className = 'summary';
  input.style.cssText = 'width:100%;padding:4px 6px;border:1px solid #007aff;border-radius:4px;font-size:14px;outline:none;font-family:inherit;';
  summaryEl.replaceWith(input);
  btn.textContent = '✓';
  btn.style.color = '#34c759';
  btn.onclick = () => saveEditMemory(id, input, btn, orig);
  input.focus();
  input.select();
  input.onkeydown = (e) => {
    if (e.key === 'Enter') saveEditMemory(id, input, btn, orig);
    if (e.key === 'Escape') cancelEdit(input, btn, orig);
  };
}

async function saveEditMemory(id, input, btn, orig) {
  const val = input.value.trim();
  if (!val || val === orig) return cancelEdit(input, btn, orig);
  try {
    const res = await fetch('/api/memories/' + encodeURIComponent(id), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ summary: val }),
    });
    if (!res.ok) throw new Error();
    // 替换回显示模式
    const summaryEl = document.createElement('div');
    summaryEl.className = 'summary';
    summaryEl.textContent = val;
    input.replaceWith(summaryEl);
    btn.textContent = '✎';
    btn.style.color = '';
    btn.onclick = () => startEditMemory(id, summaryEl, btn);
  } catch (_) {
    cancelEdit(input, btn, orig);
  }
}

function cancelEdit(input, btn, orig) {
  const summaryEl = document.createElement('div');
  summaryEl.className = 'summary';
  summaryEl.textContent = orig;
  input.replaceWith(summaryEl);
  btn.textContent = '✎';
  btn.style.color = '';
  const mid = btn.dataset.mid;
  btn.onclick = () => { if (mid) startEditMemory(mid, summaryEl, btn); };
}

async function clearChat() {
  if (!confirm('清空当前对话？记忆不会被删除。')) return;
  try {
    await fetch('/api/history', { method: 'DELETE' });
    document.getElementById('messages').innerHTML = '';
    showMessage('system', '对话已清空');
  } catch (e) {
    showMessage('system', '⚠️ 清空失败');
  }
}

async function exportChat() {
  try {
    const res = await fetch('/api/export');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chat_history.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    showMessage('system', '⚠️ 导出失败');
  }
}

// ===== 记忆手动管理 =====
function showAddMemory() {
  document.getElementById('add-memory-overlay').classList.remove('hidden');
  document.getElementById('add-summary').value = '';
  document.getElementById('add-facts').value = '';
  document.getElementById('add-status').textContent = '';
}
function closeAddMemory() {
  document.getElementById('add-memory-overlay').classList.add('hidden');
}
async function saveMemory() {
  const summary = document.getElementById('add-summary').value.trim();
  if (!summary) return;
  const facts = document.getElementById('add-facts').value.split(',').map(s => s.trim()).filter(Boolean);
  const btn = document.querySelector('#add-memory-overlay button');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const res = await fetch('/api/memories', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ summary, facts }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    document.getElementById('add-status').textContent = '✅ 已保存';
    document.getElementById('add-status').style.color = '#34c759';
    updateBadge(data.memory_count);
    setTimeout(closeAddMemory, 800);
  } catch (e) {
    document.getElementById('add-status').textContent = '❌ ' + e.message;
    document.getElementById('add-status').style.color = '#e33';
  } finally {
    btn.disabled = false; btn.textContent = '保存';
  }
}

function filterMemories(keyword) {
  const list = document.getElementById('memory-list');
  const cards = list.querySelectorAll('.memory-card');
  const kw = keyword.toLowerCase().trim();
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = !kw || text.includes(kw) ? '' : 'none';
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 输入框自动高度
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});
</script>
